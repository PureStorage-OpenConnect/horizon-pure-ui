[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-pure"
version = "2.1.0"
description = "An Everpure panel plugin for OpenStack Dashboard"
readme = "README.rst"
authors = [
    {name = "Everpure", email = "openstack-dev@purestorage.com"}
]
# The table form builds with every setuptools >= 61 (the SPDX string form
# needs setuptools >= 77), so there is deliberately no "License ::"
# classifier below.
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: OpenStack",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "py-pure-client>=1.58.0",
]

[project.optional-dependencies]
# Pulls in manila-ui so the Everpure tab on the Manila share detail pages is
# available. The plugin itself imports manila-ui lazily and works without it.
manila = ["manila-ui"]

[project.urls]
Homepage = "https://github.com/PureStorage-OpenConnect/horizon-pure-ui"

[tool.setuptools.packages.find]
# Only the plugin's own packages. Without the include list a stale build/
# or dist/ directory in the source tree is discovered as a namespace package
# and ends up inside the wheel.
include = ["horizon_pure", "horizon_pure.*"]

[tool.setuptools.package-data]
"*" = [
    "enabled/*",
    "local_settings.d/*",
    # "**" needs setuptools >= 62.3; the explicit depths keep the templates
    # in the wheel on older setuptools as well. The tree is
    #   templates/pure_panel/index.html
    #   templates/pure_panel/{flasharrays,flashblades,fafiles,shares}/*.html
    #   templates/project/volumes/*.html
    "templates/**/*",
    "templates/*/*.html",
    "templates/*/*/*.html",
    "templates/*/*/*/*.html",
    "static/**/*",
]
