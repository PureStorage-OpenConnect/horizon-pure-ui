[tox]
minversion = 4.0
envlist = py312,pep8

[testenv]
description = Django unit tests against the working tree (no array needed)
usedevelop = True
deps =
    horizon
    manila-ui
    python-manilaclient
    py-pure-client
commands =
    python -m django test --settings=horizon_pure.tests.settings horizon_pure {posargs}

[testenv:pep8]
description = flake8 with the OpenStack hacking rules
skip_install = True
deps =
    flake8
    hacking
commands =
    flake8 horizon_pure

[flake8]
max-line-length = 79
exclude = .tox,.git,*.egg-info,build,dist
show-source = True
